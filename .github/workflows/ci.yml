name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Install dependencies
        run: pixi install

      - name: Run tests
        run: pixi run python -m unittest discover tests -v

      - name: Run type check
        run: |
          pixi run pip install mypy
          pixi run mypy --ignore-missing-imports --no-strict-optional *.py || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Install linting tools
        run: |
          pixi run pip install flake8 black

      - name: Check formatting
        run: pixi run black --check --diff *.py || true

      - name: Lint
        run: pixi run flake8 *.py --max-line-length=120 --extend-ignore=E501,W503 || true
