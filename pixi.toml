[workspace]
authors = ["Hemanth Damineni <hemanthdamineni@gmail.com>"]
channels = ["conda-forge"]
name = "Gesture-Controlled-Slides"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
start = "python main.py"
visualize = "python main.py --visualize"
web = "python main.py --web"
dev = "python main.py --visualize --web"
test = "python -m unittest discover tests"

[dependencies]
python = "3.10.*"
pip = "*"

[pypi-dependencies]
dbus-python = "==1.4.0"
flask = "*"
mediapipe = "==0.10.9"
numpy = "==1.26.4"
opencv-contrib-python = "==4.11.0.86"
pillow = "==10.2.0"
pyautogui = "==0.9.54"
pycairo = "==1.29.0"
pygobject = "==3.56.1"
pystray = "==0.19.5"
